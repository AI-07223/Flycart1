services:
  smashcart:
    build: .
    restart: unless-stopped
    ports:
      - "2567:2567"
    environment:
      - NODE_ENV=production
      - PORT=2567
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:2567/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
